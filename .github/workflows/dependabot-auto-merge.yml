name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ['Dependency checks']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-merge:
    name: Approve and merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Approve Dependabot pull request
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision')" != "APPROVED" ]; then
            gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve
          fi

      - name: Enable squash auto-merge
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
